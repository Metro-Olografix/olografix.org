<section class="sec" aria-labelledby="h-shop">
  <div class="wrap sec__in">
    <h2 class="sec__h" id="h-shop">Shop</h2>
    <div class="sec__body">
      <div class="shop__copy">
        <h3>{{ T "shopPileTitle" }}</h3>
        <div>{{ T "shopPileDescription" | safeHTML }}</div>
      </div>
      <div class="christmas-lights-wrapper">
        {{ if partial "is-lights-season.html" . }}{{ partial "christmas-lights.html" . }}{{ end }}
        <div class="shop__imgs">
          <div class="shop__img"><img src="/images/pile-fronte.png" alt="{{ T "pileFrontAlt" }}" loading="lazy" width="512" height="510" /></div>
          <div class="shop__img"><img src="/images/pile-retro.png" alt="{{ T "pileBackAlt" }}" loading="lazy" width="512" height="556" /></div>
        </div>
      </div>
      <div class="shop__bot">
        <a href="https://shop.olografix.org" target="_blank" rel="noopener" class="cta shop__cta">
          <span class="cta__label">{{ T "visitShop" }}</span>
          <span class="cta__line"></span>
          <span class="cta__arrow">↗</span>
        </a>
      </div>
    </div>
  </div>
</section>
