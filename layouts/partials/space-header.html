{{ $id := .sedeId | default "pescara" }}
<div class="flex items-center justify-between mb-2">
    <div class="flex items-center gap-3">
        {{ if .icon }}
        <span class="text-2xl">{{ .icon }}</span>
        {{ else }}
        <img src="/images/home.png" alt="Space" class="h-8 md:h-10 w-8 md:w-10" />
        {{ end }}
        {{ with .city }}
        <div>
            <div class="font-bold">{{ . }}</div>
            {{ with $.subtitle }}<div class="text-xs text-gray-500">{{ . }}</div>{{ end }}
        </div>
        {{ end }}
        {{ if .isBadge }}
        <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded">NUOVA</span>
        {{ end }}
    </div>
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gray-100" id="{{ $id }}-statusContainer">
        <div id="{{ $id }}-statusDot" class="w-3 h-3 rounded-full bg-gray-300"></div>
        <span id="{{ $id }}-statusLoading" class="text-sm text-gray-600">{{ (T "hqStatusLoading") }}</span>
        <span id="{{ $id }}-statusOpen" class="text-sm hidden text-green-600">{{ (T "hqStatusOpen") }}</span>
        <span id="{{ $id }}-statusClose" class="text-sm hidden text-red-600">{{ (T "hqStatusClose") }}</span>
    </div>
</div>
