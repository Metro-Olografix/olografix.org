{{ if .Parent }}
<nav aria-label="Breadcrumb" class="phdr__bc">
  <ol>
    {{ range .Ancestors.Reverse }}
    <li><a href="{{ .RelPermalink }}"{{ if .IsHome }} aria-label="Home"{{ end }}>{{ if .IsHome }}~{{ else }}{{ .Title }}{{ end }}</a></li>
    {{ end }}
    <li aria-current="page">{{ .Title }}</li>
  </ol>
</nav>
{{ end }}
